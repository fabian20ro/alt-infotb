name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep this image aligned with the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    outputs:
      should_deploy: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify preinstalled test browsers
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const version = require('@playwright/test/package.json').version;
          assert.equal(version, '1.58.2', 'Update the Playwright container and version check together with @playwright/test.');
          for (const browser of ['chromium', 'webkit']) {
            fs.accessSync(require('playwright')[browser].executablePath(), fs.constants.X_OK);
          }
          console.log(`Playwright ${version}: preinstalled Chromium and WebKit available.`);
          NODE

      - name: Type check
        run: npm run check

      - name: Check catalog tooling and shared proxy types
        run: |
          npm run check:catalog
          npm run check:service-worker
          npm --prefix shared-api run check

      - name: Test
        run: npm test

      # A fake key plus intercepted provider responses exercises the real PWA
      # without spending quota or exposing the production key in test artifacts.
      - name: Build PWA test artifact
        env:
          VITE_CARTO_API_KEY: pwa-regression-test-key
        run: npm run build

      - name: Verify map interactions
        id: map_browser
        timeout-minutes: 10
        run: npm run test:e2e:map

      - name: Verify production PWA and tile cache
        id: map_cache
        timeout-minutes: 10
        run: npm run test:e2e:pwa

      - name: Build missing-key PWA test artifact
        env:
          VITE_CARTO_API_KEY: ''
        run: npm run build

      - name: Verify missing-key fallback
        id: map_no_key
        timeout-minutes: 5
        env:
          PWA_TEST_NO_KEY: '1'
        run: npm run test:e2e:pwa

      - name: Retain failing map evidence
        if: failure() && (steps.map_browser.outcome == 'failure' || steps.map_cache.outcome == 'failure' || steps.map_no_key.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: map-browser-failure
          path: |
            playwright-report/
            test-results/
            playwright-report-pwa/
            test-results-pwa/
          retention-days: 3

      - name: Verify configured live basemap before publication
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
        run: npm run maps:check

      # Always rebuild after fixture tests: the test key must never reach Pages.
      - name: Build deployment artifact
        env:
          VITE_CARTO_API_KEY: ${{ vars.VITE_CARTO_API_KEY }}
        run: npm run build

      - name: Upload artifact
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy-frontend:
    if: needs.build.outputs.should_deploy == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    if: needs.build.outputs.should_deploy == 'true' && github.event_name != 'schedule' && vars.WORKER_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            STB_APP_ID
            STB_APP_KEY
        env:
          STB_APP_ID: ${{ secrets.STB_APP_ID }}
          STB_APP_KEY: ${{ secrets.STB_APP_KEY }}
