name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Check catalog tooling and shared proxy types
        run: |
          npm run check:catalog
          npm --prefix shared-api run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install map-test browsers
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Verify map interactions
        id: map_browser
        timeout-minutes: 10
        run: npm run test:e2e:map

      - name: Retain failing map evidence
        if: failure() && steps.map_browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: map-browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 3

      - name: Upload artifact
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy-frontend:
    if: needs.build.outputs.should_deploy == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    if: needs.build.outputs.should_deploy == 'true' && github.event_name != 'schedule' && vars.WORKER_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          secrets: |
            STB_APP_ID
            STB_APP_KEY
        env:
          STB_APP_ID: ${{ secrets.STB_APP_ID }}
          STB_APP_KEY: ${{ secrets.STB_APP_KEY }}
