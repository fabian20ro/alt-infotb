<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#1a1a2e"/>
  <g transform="translate(12, 8)">
    <!-- Tram body -->
    <rect x="4" y="12" width="32" height="28" rx="4" fill="#4cc9f0"/>
    <!-- Windows -->
    <rect x="8" y="16" width="10" height="8" rx="1" fill="#1a1a2e"/>
    <rect x="22" y="16" width="10" height="8" rx="1" fill="#1a1a2e"/>
    <!-- Destination display -->
    <rect x="8" y="13" width="24" height="3" rx="1" fill="#ffd166"/>
    <!-- Door -->
    <rect x="17" y="28" width="6" height="10" rx="1" fill="#1a1a2e"/>
    <!-- Wheels -->
    <circle cx="12" cy="42" r="3" fill="#e8e8f0"/>
    <circle cx="28" cy="42" r="3" fill="#e8e8f0"/>
    <!-- Pantograph -->
    <line x1="20" y1="12" x2="14" y2="4" stroke="#e8e8f0" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="4" x2="26" y2="4" stroke="#e8e8f0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
